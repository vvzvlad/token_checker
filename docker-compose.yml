# Deploy REFERENCE. The real deployment is the `tokenchecker` service inside the
# multi-service `crypt-common` stack on nebula, managed through Portainer — this file
# documents what that service looks like on its own, and is what you would use to run
# the image standalone. Values below are PLACEHOLDERS (XXX), not real secrets.
#
# No published port or networks: the only listener is the local /health endpoint for
# docker's probe. No volume: the wallets live in Grist, the service keeps no state.

services:
  token_checker:
    image: gitea.vvzvlad.xyz/projects/token_checker:latest
    # Production's container name, without the underscore; renaming it is a production
    # change.
    container_name: tokenchecker
    # Load-bearing: a container with broken configuration exits, and this restarts it.
    restart: unless-stopped
    # The app runs as non-root `app` (uid 1000): the entrypoint starts as root, chowns
    # /app/data and drops privileges via gosu. A `user:` override here makes the
    # entrypoint skip the chown — the volume must then already be owned by that uid.
    security_opt:
      - no-new-privileges:true   # forbids privilege escalation via setuid binaries; gosu only drops privileges
    environment:
      GRIST_SERVER: XXX
      GRIST_DOC_ID: XXX
      GRIST_API_KEY: XXX
      ETHERSCAN_API_KEY: XXX
      TZ: Europe/Moscow
      # Both or neither: with only one of them the watchdog logs "notification skipped"
      # and dies quietly, which is a supported configuration.
      # TELEGRAM_BOT_TOKEN: XXX
      # TELEGRAM_CHAT_ID: XXX
      # A self-hosted Bot API server; unset means https://api.telegram.org.
      # TELEGRAM_BOT_API_SERVER: XXX
      # The default below is a production contract: the stack does not pass this
      # variable and the image's HEALTHCHECK curls the same default. Override it only if
      # you also know what the healthcheck will then probe.
      # HEALTH_PORT: 8080
    logging:
      driver: "json-file"
      options:
        max-file: 5
        max-size: 10m
    labels:
      # What production carries. Auto-update pulls a new :latest; auto-heal restarts the
      # container when /health stops answering 200.
      io.portainer.update.enable: "true"
      io.portainer.autoheal.enable: "true"

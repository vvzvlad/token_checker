name: Docker Image CI

# No `pull_request` trigger here on purpose. This workflow pushes :latest to the Gitea
# registry, and :latest is the tag production follows — the `tokenchecker` container in the
# `crypt-common` stack on nebula carries watchtower labels, so whatever lands on :latest is
# what gets rolled out once that stack is pointed at this registry (a separate, manual step
# that is not this workflow's business). A build off a PR branch must never be able to move
# that tag. PRs are covered by tests.yml, which runs the same test suite and the same smoke
# but never logs in and never pushes.
#
# The workflow this replaces — .github/workflows/docker-image.yml, pushing
# `vvzvlad/token_checker:latest` to Docker Hub — did at least get the trigger right: it
# only ran on push to main. What it had NO version of at all was a gate. Checkout, buildx,
# login, `docker/build-push-action` with `push: true`, and that was the entire file: the
# image was published by the same step that built it, so there was never a moment between
# "it built" and "it is live" in which anything could be checked.
#
# The repository is PUBLIC on both forges (Gitea is canonical, GitHub is a push-mirror).
# Nothing here depends on that: the push below authenticates with secrets.REGISTRY_TOKEN
# either way.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# No `packages: write` here: that scope is GitHub-specific and has no effect on Gitea
# Actions — the built-in GITEA_TOKEN carries no package scope at all. The registry push
# below authenticates with the REGISTRY_TOKEN PAT (an organisation-level secret on
# `projects`, inherited by this repo) instead.
permissions:
  contents: read   # checkout

# Two pushes to the same branch in a row must not race: the runs are independent and the
# older one may finish last, leaving ITS :latest on the registry — the next watchtower
# poll would then ship the previous commit.
# The group alone already fixes that: runs are serialised, so the newest commit's :latest
# is written last. Cancelling is deliberately OFF — it would kill the older run together
# with its :<sha> image, and on two quick pushes the intermediate commit would never be
# built, leaving holes in the tag history exactly where a rollback is most likely to be
# needed.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # The gate the convention asks for: `build` needs this job, so red tests cannot produce
    # an image at all. Before this refactor the repository had no tests and the smoke was
    # the only thing standing between a commit and :latest.
    # 25 is the outer bound over the single 20-minute step below, leaving room for checkout
    # and the container cleanup that follows it: it must EXCEED the sum, because act_runner
    # kills the whole job when this fires, and a cleanup step that never gets to run is
    # exactly how a container ends up left behind on the shared daemon.
    timeout-minutes: 25
    # Job-level, so the step that CREATES the test container and the step that REMOVES it
    # cannot disagree about its name. Written as two literals in two steps they would go on
    # looking correct while one of them was edited, turning the cleanup into a step that
    # removes nothing and reports success. The run id is what keeps concurrent runs on this
    # shared daemon from colliding on the name; the `-push-` infix only makes `docker ps`
    # readable about which workflow started it.
    env:
      TEST_NAME: token-checker-tests-push-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Run the test suite in a container
      # No `actions/setup-python` here, and that is deliberate rather than stylistic. Setup
      # actions are not verified on this self-hosted runner, and the failure mode of a setup
      # action that does not work is not a red job — it is a job that runs to the end having
      # silently checked nothing, which on a pull request means a review that was told the
      # tests passed. Running the suite inside a container started by the same docker the
      # build uses makes "the tests ran" and "docker works on this runner" the same statement.
      timeout-minutes: 20
      env:
        # The same interpreter version the Dockerfile ships. Testing under a different python
        # than the one that runs in production is exactly the gap this arrangement closes:
        # a suite that is green on one python and an image that runs another. `-slim` rather
        # than the full base only because nothing in the suite needs curl or the build tools.
        RUNTIME_IMAGE: python:3.13-slim
      # The `run:` body of this step is byte-identical to the one in tests.yml.
      # The PR job and the publishing job must run the same suite the same way, and the
      # cheapest way to guarantee that is for the executed text to be literally the same text.
      run: |
        set -e
        set -o pipefail
        # Clear the name before claiming it. A re-run from the Gitea UI reuses the same
        # github.run_id, so $TEST_NAME can already be taken by a container a previously
        # killed attempt left behind — and `docker run --name` fails outright on a name
        # conflict, so the re-run would die before the suite ever started, with an error
        # about a container instead of about the code.
        docker rm -f -v "$TEST_NAME" || true
        # The workspace is streamed into the container as a tar over stdin rather than
        # bind-mounted, and that is not a stylistic choice either. This job runs INSIDE
        # act_runner's own job container while `docker` talks to the HOST's daemon through
        # the mounted socket — so a `-v "$PWD:/src"` would ask the host to mount a path that
        # means something entirely different there, or nothing at all. A tar over stdin is
        # correct in every one of those configurations, and it also keeps the container from
        # writing __pycache__ and .pytest_cache back into the checkout as root.
        # .dockerignore does NOT apply here — this is a tar, not a build context — which is
        # what makes tests/ and requirements-dev.txt available, both of which the image
        # itself deliberately excludes. That same fact is why every exclusion is spelled out
        # by hand: `.git` is the largest thing in the tree and nothing reads it; `.venv` is a
        # virtualenv built on the HOST, tens of megabytes of wheels this container could not
        # load; `data/` is runtime state, empty on the runner but full of real state on a
        # workstation running this same command by hand to reproduce a failure; `.env` is the
        # sharpest case of that — src/settings.py declares `env_file=".env"`, so
        # pydantic-settings READS whichever one it finds beside the code, and without this
        # flag a by-hand reproduction would run against the developer's real credentials and
        # ship them into a container for nothing; `__pycache__` and `.pytest_cache` are
        # written by a DIFFERENT interpreter than the one about to run the suite.
        # `--pull always`: this daemon is persistent, so without it a once-pulled
        # python:3.13-slim would sit in its cache for months and the tests would run against
        # an unpatched base — the same reason `docker build --pull` carries the flag.
        # The four variables are PLACEHOLDERS and nothing in the suite performs a real
        # request with them: tests/conftest.py setdefault()s the same four before anything
        # can import src.settings, so the suite is green in a bare environment too, and they
        # are spelled out here so a CI run does not silently depend on that file keeping its
        # defaults.
        # `--name` is what makes this container reachable AFTERWARDS, and it does not
        # duplicate `--rm`: `--rm` is removal-on-exit performed by the daemon, and a step
        # killed by its own `timeout-minutes` kills the docker CLI here on the runner, not
        # the container over on the host's daemon — that container goes on running, never
        # exits, so `--rm` never fires and the cleanup step below has to remove it BY NAME.
        tar -cf - --exclude=./.git --exclude=./.venv --exclude=./data \
          --exclude=./.env --exclude=./.pytest_cache --exclude=__pycache__ . \
          | docker run --rm -i --pull always --name "$TEST_NAME" \
          -e GRIST_SERVER=http://grist.invalid \
          -e GRIST_DOC_ID=test-doc \
          -e GRIST_API_KEY=test-key \
          -e ETHERSCAN_API_KEY=test-etherscan-key \
          -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
          -e PYTHONDONTWRITEBYTECODE=1 \
          "$RUNTIME_IMAGE" \
          sh -c 'set -e; mkdir -p /src; tar -xf - -C /src; cd /src; pip install --no-cache-dir -r requirements-dev.txt; pytest --tb=short -q'

    - name: Remove the test container from the runner
      # `always()` because the run this step exists for is precisely the one that failed or
      # was killed. On a green run the container has exited and `--rm` has already removed
      # it; on the run where the step above hit its 20-minute bound, the docker CLI died on
      # the runner while the container kept running on a daemon shared by every repository.
      # Best-effort (`|| true`) so a container that is already gone cannot turn a leftover
      # into a red job and bury the actual verdict of the test suite. `-v` removes the
      # anonymous volumes that container owned — nothing declares one today, it is here for
      # the day this project's Dockerfile does.
      if: always()
      run: |
        docker rm -f -v "$TEST_NAME" || true

  build:
    needs: test                          # no green tests → no image is built
    runs-on: ubuntu-latest
    # cirunner-hatbox is shared by every repository in the fleet, so a hung step does not
    # just stall this run — it holds a runner slot that everyone else is queueing for.
    # Gitea's own default is far too generous for that.
    # The three step-level timeouts below come to 55 minutes (20 build + 20 smoke + 15
    # push); 60 leaves 5 on top for checkout, the registry login and the two cleanup steps.
    # The outer bound has to EXCEED the sum, not equal it: act_runner kills the whole job
    # when this fires, and a step marked `if: always()` is not guaranteed to run afterwards
    # — so a job that dies mid-push leaves the smoke container and a ~400 MB image sitting
    # on the daemon the entire fleet shares.
    timeout-minutes: 60
    # Job-level, so the smoke step that CREATES these containers and the cleanup step that
    # REMOVES them cannot disagree about the base name. The run id keeps concurrent runs on
    # this shared daemon from colliding on it.
    env:
      SMOKE_NAME: token-checker-smoke-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Compute image tags
      id: tags
      # main -> :latest + :<sha> (production follows :latest); ANY other branch -> :<branch>.
      # The check is against `main` because that is this repo's default branch — a repo
      # living on `master` with a `main` check here would build happily and never once
      # produce the :latest that production actually pulls.
      # Only main is pushed to by the trigger above, but workflow_dispatch can be fired off
      # any ref, so the else branch still has to be correct.
      # Do NOT hardcode a fixed tag in the else branch: a build off a side branch would then
      # silently overwrite the tag production deploys from — one typo away from shipping
      # unreviewed code into the `crypt-common` stack.
      env:
        # Passed through the environment instead of being interpolated into the script
        # text: git allows `$`, backticks, quotes and parentheses in branch names, so a
        # branch like `feat/$(id)` would otherwise execute on the runner, which is
        # self-hosted and mounts the host's docker socket.
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        # Gitea allows uppercase letters in repository names, docker does not accept them
        # in an image path — a repo like `Token_Checker` would fail the build with
        # `invalid reference format`, so lowercase it here. Owner and name both come from
        # $REPO, which makes this `gitea.vvzvlad.xyz/projects/token_checker` and keeps the
        # file free of a hand-written path that could drift from where the repo lives.
        IMAGE="gitea.vvzvlad.xyz/$(printf '%s' "$REPO" | tr 'A-Z' 'a-z')"
        if [ "$REF_NAME" = "main" ]; then
          # Tag ORDER matters and must not be "tidied up": the push step iterates over
          # $TAGS left to right, so :latest is pushed LAST and acts as the commit of the
          # whole publication. If :<sha> fails to push (network, registry quota, disk), the
          # run stops before :latest moves and production keeps running the previous image.
          # The reverse order would publish a :latest that watchtower deploys while its
          # immutable :<sha> twin — the only rollback point — never made it to the
          # registry.
          # The Docker Hub workflow this replaces pushed ONLY `vvzvlad/token_checker:latest`,
          # so no such twin ever existed: every published image overwrote the one before it
          # and "go back to what ran yesterday" had no answer at all.
          echo "tags=$IMAGE:$SHA $IMAGE:latest" >> "$GITHUB_OUTPUT"
          # The smoke gate needs ONE unambiguous tag out of the list above. The :<sha> one
          # is it — :latest is a moving target shared with whatever ran before, :<sha> can
          # only ever mean this commit's image.
          echo "smoke=$IMAGE:$SHA" >> "$GITHUB_OUTPUT"
        else
          # Sanitise the branch name into a legal docker tag: everything outside
          # [A-Za-z0-9_.-] (a `/` in feat/foo above all) becomes `-`, and the result is cut
          # to 100 chars — branch names have no length limit, docker rejects tags over 128.
          # The `sed` fixes the first character: docker requires a tag to match
          # [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}, so a branch like `-fix`, `(test)` or `+wip`
          # would otherwise produce a leading `-` and fail the build with
          # `invalid reference format`.
          branch_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[^A-Za-z0-9_]/_/' | cut -c1-100)
          # The sanitiser passes a name through untouched when it already consists of legal
          # characters, so a branch literally named `latest` would come out as the
          # production tag and — one manual workflow_dispatch later — ship unreviewed code
          # into the stack. The `main` check above does not cover this: the branch is not
          # `main`, it only borrows its tag.
          # Reserved names are therefore prefixed instead of being used as-is.
          if [ "$branch_tag" = "latest" ]; then
            branch_tag="branch-latest"
          fi
          echo "tags=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
          echo "smoke=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Docker image
      # Step-level `timeout-minutes` is the one known to be enforced by Gitea's act_runner;
      # the job-level one above is only the outer bound. 20 minutes is far above a
      # realistic cold build: this is `python:3.13`, one `apt-get install gosu` and a
      # `pip install` of the pinned wheels in requirements.txt — pure-python ones plus
      # pydantic-core, which ships a cp313 manylinux wheel and is not compiled here. The
      # bulk of the image is the non-slim python:3.13 base.
      timeout-minutes: 20
      env:
        # Through the environment, not interpolated into the script text: the only thing
        # standing between a branch name and command execution on the runner is the `tr`
        # filter in the step above. `$TAGS` below is intentionally unquoted — the tags are
        # a space-separated list and word splitting is exactly what turns it into loop
        # items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        tag_args=""
        for tag in $TAGS; do tag_args="$tag_args --tag $tag"; done
        # --pull is required here: unlike GitHub's ephemeral runners, cirunner-hatbox is
        # self-hosted with a persistent docker daemon, so without the flag the once pulled
        # python:3.13 would sit in its cache for months and every build would inherit an
        # unpatched base layer.
        # Note that this IS a BuildKit build even though no `docker buildx` appears on the
        # line: BuildKit has been `docker build`'s default since Engine 23.0. It caches
        # into its own builder store, which is why the cleanup step at the end of this job
        # cannot reclaim everything — see the caveat there.
        docker build --pull . --file Dockerfile $tag_args

    - name: Smoke-test the built image
      # The second gate, after the test job. It sits BETWEEN build and push on purpose: a
      # red smoke means nothing ever reaches the registry, so production keeps running the
      # previous image. The Docker Hub workflow this replaces had nothing in this position
      # at all — the image was published by the same step that built it.
      #
      #
      # The pytest suite in the job above covers the logic; this covers what only an
      # assembled image can answer, and ci/smoke.py's module docstring lists all eight
      # groups. It runs ON THE RUNNER and drives `docker` itself, because several of its
      # checks are about the container as an object: what PID 1 is and which uid it runs as,
      # how the image behaves with no environment at all, what .dockerignore let through,
      # and what docker's OWN health verdict is. None of those can be answered from a
      # process already running inside it.
      #
      # NO PORT IS PUBLISHED and nothing here talks to 127.0.0.1. This job runs inside
      # act_runner's own job container while `docker` drives a daemon outside it, so a
      # published port lands in that daemon's network namespace and is not reachable from
      # here; everything that has to be seen from inside a container is read with
      # `docker exec`. Same reasoning as the tar-over-stdin in the test job above.
      #
      # The gate holds no credential and reaches no external service: it invents placeholder
      # configuration pointing at a `.invalid` host, which RFC 2606 reserves and no resolver
      # can ever answer. That is what makes it runnable on a pull request at all — a gate
      # that needed real keys would simply be switched off on PRs, which is where the
      # artefact most needs looking at.
      #
      # 20 minutes is set against ci/smoke.py's OWN worst case, which the script documents
      # and sums from its individual per-call bounds: 1080 s, eighteen minutes, if every
      # docker call it makes runs out its budget. In practice the whole gate is well under a
      # minute. Being killed BY this timeout is what the margin is for: the script's own
      # container cleanup would not run, and the `if: always()` step below is what catches
      # that.
      timeout-minutes: 20
      env:
        # The exact tag the build step above produced. SMOKE_NAME comes from the job-level
        # `env:` so this step and the cleanup step below cannot disagree about it.
        SMOKE_IMAGE: ${{ steps.tags.outputs.smoke }}
      # The `run:` body of this step is byte-identical to the one in tests.yml
      # — the commentary above it and where its two variables come from are free to differ,
      # and do. The PR gate and the publishing gate must run the same checks against the same
      # kind of container, and the cheapest way to guarantee that is for the executed text to
      # be literally the same text — anything else drifts, and it drifts silently, in the
      # direction of the PR gate testing less.
      run: |
        python3 ci/smoke.py

    - name: Log in to the Gitea container registry
      # Deliberately placed here and not at the top of the job: `docker build` runs
      # arbitrary RUN instructions from the Dockerfile and the smoke step runs the image's
      # own code, both on a runner whose docker.sock is the host's. Logging in only now
      # keeps the registry credentials out of the job's docker config for the whole
      # build-and-test stretch.
      uses: docker/login-action@v4
      with:
        registry: gitea.vvzvlad.xyz
        username: ${{ github.repository_owner }}
        # PAT with the `write:package` scope, stored as an organisation secret on
        # `projects` and inherited here — do not add a repo-level secret of the same name,
        # it would shadow the org one. The built-in GITEA_TOKEN cannot be used: it carries
        # no package scope.
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Push Docker images
      # 15 minutes for a ~400 MB payload on top of the python:3.13 base. That is generous
      # on a healthy link and meant to be: a bound too tight would abort a push that was
      # making perfectly good progress, leaving a half-pushed :<sha> and no :latest.
      timeout-minutes: 15
      env:
        # Same reasoning as in the build step: pass the tags through the environment, and
        # leave `$TAGS` unquoted so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        for tag in $TAGS; do docker push "$tag"; done

    - name: Remove the smoke containers from the runner
      # `always()`, and BEFORE the image cleanup below: cirunner-hatbox has one persistent
      # docker daemon shared by every repository, so a container left behind by a failed run
      # would sit there forever — and would also pin the image, making the `docker rmi` in
      # the next step fail.
      # ci/smoke.py removes both of them itself — each one before it starts it, and both
      # again in a `finally` — so on a normal run this is a no-op. It exists for the run
      # where the smoke step was killed by its own timeout and never reached any of that: a
      # subprocess timeout inside the script kills the docker CLIENT on the runner, not the
      # container on the daemon, so even a `--rm` container can survive it and has to be
      # removed here, by the name ci/smoke.py gave it for exactly this purpose.
      # The empty suffix is the long-lived container started with the image's real command;
      # -guard is the short-lived one the missing-configuration check runs. Kept in step with
      # GUARD_SUFFIX in ci/smoke.py.
      # `-v` changes nothing TODAY — this Dockerfile declares no VOLUME — and BOTH removal
      # paths carry it for the day one is added: `remove_container()` in ci/smoke.py, which
      # gets there first on any normal run, and this step, which is what is left when
      # smoke.py was killed before its `finally`. One alone would cover half the runs. It
      # cannot take anything else with it: `docker rm -v` removes only that one container's
      # anonymous volumes, never a named volume such as the ones docker-compose creates.
      if: always()
      run: |
        for suffix in "" -guard; do docker rm -f -v "$SMOKE_NAME$suffix" || true; done

    - name: Remove the built images from the runner
      # The runner's docker daemon is persistent, so the images built here would otherwise
      # pile up and grow the disk forever. This step removes ONLY the tags this run created
      # — no `docker system prune`, which would also wipe the images of every other repo
      # sharing the same daemon, including containers other jobs are mid-run against.
      # It does NOT reclaim everything: `docker rmi <tag>` never touches the BuildKit cache
      # (that lives in a separate builder store and is only freed by
      # `docker builder prune`), and `--pull` above leaves the previous base image untagged
      # as a dangling image whenever upstream publishes a new python:3.13 digest. Both need
      # a separate periodic cleanup on the runner host.
      # `always()` so the cleanup runs even when the smoke or the push above fails.
      if: always()
      env:
        # Same reasoning as in the build step: pass the tags through the environment, and
        # leave `$TAGS` unquoted so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        for tag in $TAGS; do docker rmi "$tag" || true; done

name: Tests

# PR gate. This workflow deliberately never logs in to the registry and never pushes, and
# not one `secrets` expression appears anywhere in this file — the word shows up only in
# prose like this line, never as a value, so there is nothing here for a leak to leak. It
# runs the same pytest suite the publishing workflow gates on, then proves that the image
# still builds, that every file it ships compiles and imports under the image's own python,
# that PID 1 is `python main.py` running as a non-root uid, that the missing-environment
# guard still fires, and that both the health endpoint AND docker's own HEALTHCHECK verdict
# come up healthy — while :latest, the tag the `tokenchecker` container in the
# `crypt-common` stack on nebula follows, stays untouched by PR branches.
on:
  # Manual re-run: without it a run that flaked on runner networking could only be retried
  # by pushing an empty commit to the PR branch. Safe to expose here — this workflow
  # touches no registry and no secrets, it only builds and smoke-tests.
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read   # checkout

# Nothing here is published, so a superseded run has no value: when a PR gets a new push,
# kill the in-flight check and run the fresh head instead. This is the opposite of
# image-check-publish.yml, where cancelling would leave holes in the :<sha> tag history.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # 25 is the outer bound over the single 20-minute step below, leaving room for checkout
    # and the container cleanup that follows it: it must EXCEED the sum, because act_runner
    # kills the whole job when this fires, and a cleanup step that never gets to run is
    # exactly how a container ends up left behind on the shared daemon.
    timeout-minutes: 25
    # Job-level, so the step that CREATES the test container and the step that REMOVES it
    # cannot disagree about its name. Written as two literals in two steps they would go on
    # looking correct while one of them was edited, turning the cleanup into a step that
    # removes nothing and reports success. The run id is what keeps concurrent runs on this
    # shared daemon from colliding on the name; the `-pr-` infix only makes `docker ps`
    # readable about which workflow started it.
    env:
      TEST_NAME: token-checker-tests-pr-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Run the test suite in a container
      # No `actions/setup-python` here, and that is deliberate rather than stylistic. Setup
      # actions are not verified on this self-hosted runner, and the failure mode of a setup
      # action that does not work is not a red job — it is a job that runs to the end having
      # silently checked nothing, which on a pull request means a review that was told the
      # tests passed. Running the suite inside a container started by the same docker the
      # build uses makes "the tests ran" and "docker works on this runner" the same statement.
      timeout-minutes: 20
      env:
        # The same interpreter version the Dockerfile ships. Testing under a different python
        # than the one that runs in production is exactly the gap this arrangement closes:
        # a suite that is green on one python and an image that runs another. `-slim` rather
        # than the full base only because nothing in the suite needs curl or the build tools.
        RUNTIME_IMAGE: python:3.13-slim
      # The `run:` body of this step is byte-identical to the one in image-check-publish.yml.
      # The PR job and the publishing job must run the same suite the same way, and the
      # cheapest way to guarantee that is for the executed text to be literally the same text.
      run: |
        set -e
        set -o pipefail
        # Clear the name before claiming it. A re-run from the Gitea UI reuses the same
        # github.run_id, so $TEST_NAME can already be taken by a container a previously
        # killed attempt left behind — and `docker run --name` fails outright on a name
        # conflict, so the re-run would die before the suite ever started, with an error
        # about a container instead of about the code.
        docker rm -f -v "$TEST_NAME" || true
        # The workspace is streamed into the container as a tar over stdin rather than
        # bind-mounted, and that is not a stylistic choice either. This job runs INSIDE
        # act_runner's own job container while `docker` talks to the HOST's daemon through
        # the mounted socket — so a `-v "$PWD:/src"` would ask the host to mount a path that
        # means something entirely different there, or nothing at all. A tar over stdin is
        # correct in every one of those configurations, and it also keeps the container from
        # writing __pycache__ and .pytest_cache back into the checkout as root.
        # .dockerignore does NOT apply here — this is a tar, not a build context — which is
        # what makes tests/ and requirements-dev.txt available, both of which the image
        # itself deliberately excludes. That same fact is why every exclusion is spelled out
        # by hand: `.git` is the largest thing in the tree and nothing reads it; `.venv` is a
        # virtualenv built on the HOST, tens of megabytes of wheels this container could not
        # load; `data/` is runtime state, empty on the runner but full of real state on a
        # workstation running this same command by hand to reproduce a failure; `.env` is the
        # sharpest case of that — src/settings.py declares `env_file=".env"`, so
        # pydantic-settings READS whichever one it finds beside the code, and without this
        # flag a by-hand reproduction would run against the developer's real credentials and
        # ship them into a container for nothing; `__pycache__` and `.pytest_cache` are
        # written by a DIFFERENT interpreter than the one about to run the suite.
        # `--pull always`: this daemon is persistent, so without it a once-pulled
        # python:3.13-slim would sit in its cache for months and the tests would run against
        # an unpatched base — the same reason `docker build --pull` carries the flag.
        # The four variables are PLACEHOLDERS and nothing in the suite performs a real
        # request with them: tests/conftest.py setdefault()s the same four before anything
        # can import src.settings, so the suite is green in a bare environment too, and they
        # are spelled out here so a CI run does not silently depend on that file keeping its
        # defaults.
        # `--name` is what makes this container reachable AFTERWARDS, and it does not
        # duplicate `--rm`: `--rm` is removal-on-exit performed by the daemon, and a step
        # killed by its own `timeout-minutes` kills the docker CLI here on the runner, not
        # the container over on the host's daemon — that container goes on running, never
        # exits, so `--rm` never fires and the cleanup step below has to remove it BY NAME.
        tar -cf - --exclude=./.git --exclude=./.venv --exclude=./data \
          --exclude=./.env --exclude=./.pytest_cache --exclude=__pycache__ . \
          | docker run --rm -i --pull always --name "$TEST_NAME" \
          -e GRIST_SERVER=http://grist.invalid \
          -e GRIST_DOC_ID=test-doc \
          -e GRIST_API_KEY=test-grist-api-key \
          -e ETHERSCAN_API_KEY=test-etherscan-api-key \
          -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
          -e PYTHONDONTWRITEBYTECODE=1 \
          "$RUNTIME_IMAGE" \
          sh -c 'set -e; mkdir -p /src; tar -xf - -C /src; cd /src; pip install --no-cache-dir -r requirements-dev.txt; pytest --tb=short -q'

    - name: Remove the test container from the runner
      # `always()` because the run this step exists for is precisely the one that failed or
      # was killed. On a green run the container has exited and `--rm` has already removed
      # it; on the run where the step above hit its 20-minute bound, the docker CLI died on
      # the runner while the container kept running on a daemon shared by every repository.
      # Best-effort (`|| true`) so a container that is already gone cannot turn a leftover
      # into a red job and bury the actual verdict of the test suite. `-v` removes the
      # anonymous volumes that container owned — nothing declares one today, it is here for
      # the day this project's Dockerfile does.
      if: always()
      run: |
        docker rm -f -v "$TEST_NAME" || true

  build-and-smoke:
    runs-on: ubuntu-latest
    needs: test                          # no green tests → no image is built
    # cirunner-hatbox is shared by every repository in the fleet, so a hung step does not
    # just stall this run — it holds a runner slot that everyone else is queueing for.
    # Gitea's own default is far too generous for that.
    # Deliberately the same outer bound as image-check-publish.yml, so the two gates cannot
    # drift apart on a number that is easy to change in one file and forget in the other.
    # It is only ever an outer bound: this job has no push step, so its step-level timeouts
    # (20 build + 20 smoke = 40 minutes) are the ones act_runner actually enforces, and 50
    # leaves the rest for checkout and the two cleanup steps. It must stay above their sum:
    # a job killed by this timeout may never run its `if: always()` cleanup, leaving
    # containers and a ~400 MB image on the docker daemon shared by the whole fleet.
    timeout-minutes: 50
    # Job-level, so the smoke step that CREATES these containers and the cleanup step that
    # REMOVES them cannot disagree about the base name. The run id keeps two concurrent pull
    # requests on this shared daemon from colliding on it.
    env:
      SMOKE_NAME: token-checker-pr-check-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Compute the local image tag
      id: tags
      # A purely local tag: no registry host in front of it, so there is nothing here that
      # `docker push` could even target. The run id keeps concurrent PR checks on the
      # shared runner daemon from clobbering each other's tag.
      env:
        RUN_ID: ${{ github.run_id }}
      run: |
        echo "local=token-checker-pr-check:$RUN_ID" >> "$GITHUB_OUTPUT"

    - name: Build the Docker image
      # Step-level `timeout-minutes` is the one known to be enforced by Gitea's act_runner;
      # the job-level one above is only the outer bound. 20 minutes is far above a
      # realistic cold build: `python:3.13`, one `apt-get install gosu` and a `pip install`
      # of the pinned wheels in requirements.txt, with nothing compiled locally — roughly
      # 400 MB and a couple of minutes. Same number as in image-check-publish.yml:
      # the two gates build the identical Dockerfile and must not disagree about how long
      # that is allowed to take.
      timeout-minutes: 20
      env:
        # Through the environment rather than interpolated into the script text, same rule
        # as everywhere else in this repo's workflows.
        LOCAL_TAG: ${{ steps.tags.outputs.local }}
      run: |
        # --pull for the same reason as in image-check-publish.yml: cirunner-hatbox is
        # self-hosted with a persistent docker daemon, so without the flag a stale
        # python:3.13 could sit in the cache for months. And as there, this is a BuildKit
        # build despite the absence of `docker buildx` — that has been `docker build`'s
        # default since Engine 23.0.
        docker build --pull . --file Dockerfile --tag "$LOCAL_TAG"

    - name: Smoke-test the built image
      # The same gate the publishing workflow runs, in the same position — after the image
      # exists, before anything else. Here there is nothing after it, which is exactly the
      # point: a pull request gets the identical verdict on the identical artefact without
      # any possibility of publishing it.
      #
      # The pytest suite in the job above covers the logic; this covers what only an
      # assembled image can answer, and ci/smoke.py's module docstring lists all eight
      # groups. It runs ON THE RUNNER and drives `docker` itself, because several of its
      # checks are about the container as an object: what PID 1 is and which uid it runs as,
      # how the image behaves with no environment at all, what .dockerignore let through,
      # and what docker's OWN health verdict is. None of those can be answered from a
      # process already running inside it.
      #
      # NO PORT IS PUBLISHED and nothing here talks to 127.0.0.1. This job runs inside
      # act_runner's own job container while `docker` drives a daemon outside it, so a
      # published port lands in that daemon's network namespace and is not reachable from
      # here; everything that has to be seen from inside a container is read with
      # `docker exec`. Same reasoning as the tar-over-stdin in the test job above.
      #
      # The gate holds no credential and reaches no external service: it invents placeholder
      # configuration pointing at a `.invalid` host, which RFC 2606 reserves and no resolver
      # can ever answer. That is what makes it runnable on a pull request at all — a gate
      # that needed real keys would simply be switched off on PRs, which is where the
      # artefact most needs looking at.
      #
      # 20 minutes is set against ci/smoke.py's OWN worst case, which the script documents
      # and sums from its individual per-call bounds: 1080 s, eighteen minutes, if every
      # docker call it makes runs out its budget. In practice the whole gate is well under a
      # minute. Being killed BY this timeout is what the margin is for: the script's own
      # container cleanup would not run, and the `if: always()` step below is what catches
      # that.
      timeout-minutes: 20
      env:
        # The exact tag the build step above produced. SMOKE_NAME comes from the job-level
        # `env:` so this step and the cleanup step below cannot disagree about it.
        SMOKE_IMAGE: ${{ steps.tags.outputs.local }}
      # The `run:` body of this step is byte-identical to the one in image-check-publish.yml
      # — the commentary above it and where its two variables come from are free to differ,
      # and do. The PR gate and the publishing gate must run the same checks against the same
      # kind of container, and the cheapest way to guarantee that is for the executed text to
      # be literally the same text — anything else drifts, and it drifts silently, in the
      # direction of the PR gate testing less.
      run: |
        python3 ci/smoke.py

    - name: Remove the smoke containers from the runner
      # `always()`, and BEFORE the image cleanup below: cirunner-hatbox has one persistent
      # docker daemon shared by every repository, so a container left behind by a failed run
      # would sit there forever — and would also pin the image, making the `docker rmi` in
      # the next step fail.
      # ci/smoke.py removes both of them itself — each one before it starts it, and both
      # again in a `finally` — so on a normal run this is a no-op. It exists for the run
      # where the smoke step was killed by its own timeout and never reached any of that: a
      # subprocess timeout inside the script kills the docker CLIENT on the runner, not the
      # container on the daemon, so even a `--rm` container can survive it and has to be
      # removed here, by the name ci/smoke.py gave it for exactly this purpose.
      # The empty suffix is the long-lived container started with the image's real command;
      # -guard is the short-lived one the missing-configuration check runs. Kept in step with
      # GUARD_SUFFIX in ci/smoke.py.
      # `-v` changes nothing TODAY — this Dockerfile declares no VOLUME — and BOTH removal
      # paths carry it for the day one is added: `remove_container()` in ci/smoke.py, which
      # gets there first on any normal run, and this step, which is what is left when
      # smoke.py was killed before its `finally`. One alone would cover half the runs. It
      # cannot take anything else with it: `docker rm -v` removes only that one container's
      # anonymous volumes, never a named volume such as the ones docker-compose creates.
      if: always()
      run: |
        for suffix in "" -guard; do docker rm -f -v "$SMOKE_NAME$suffix" || true; done

    - name: Remove the built image from the runner
      # The runner's docker daemon is persistent and shared with other repos, so every PR
      # check would otherwise leave an image behind forever. Removes ONLY the tag this run
      # created — no `docker system prune`, which would also wipe the images of every other
      # repo sharing the same daemon.
      # This gate runs on every push to a PR, so it produces MORE of that garbage than the
      # publishing workflow does — see the full note in image-check-publish.yml.
      # It does NOT reclaim everything: `docker rmi <tag>` never frees the BuildKit cache
      # (a separate builder store, reclaimed only by `docker builder prune`), and `--pull`
      # leaves the previous base image dangling whenever upstream publishes a new
      # python:3.13 digest. Both need a separate periodic cleanup on the runner host.
      # `always()` so a failed smoke still cleans up after itself.
      if: always()
      env:
        LOCAL_TAG: ${{ steps.tags.outputs.local }}
      run: |
        docker rmi "$LOCAL_TAG" || true

name: Tests

# PR gate. This workflow deliberately never logs in to the registry and never pushes, and
# not one `secrets` expression appears anywhere in this file — the word shows up only in
# prose like this line, never as a value, so there is nothing here for a leak to leak. It
# proves that the image still builds, that its command runs a script which compiles and
# can import everything it needs, that the missing-environment guard still fires, and that
# the health endpoint still answers — while :latest, the tag the `tokenchecker` container
# in the `crypt-common` stack on nebula follows, stays untouched by PR branches.
on:
  # Manual re-run: without it a run that flaked on runner networking could only be retried
  # by pushing an empty commit to the PR branch. Safe to expose here — this workflow
  # touches no registry and no secrets, it only builds and smoke-tests.
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read   # checkout

# Nothing here is published, so a superseded run has no value: when a PR gets a new push,
# kill the in-flight check and run the fresh head instead. This is the opposite of
# image-check-publish.yml, where cancelling would leave holes in the :<sha> tag history.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    # cirunner-hatbox is shared by every repository in the fleet, so a hung step does not
    # just stall this run — it holds a runner slot that everyone else is queueing for.
    # Gitea's own default is far too generous for that.
    # Deliberately the same outer bound as image-check-publish.yml, so the two gates cannot
    # drift apart on a number that is easy to change in one file and forget in the other.
    # It is only ever an outer bound: this job has no push step, so its step-level timeouts
    # (20 build + 5 smoke = 25 minutes) are the ones act_runner actually enforces, and 45
    # leaves the rest for checkout and the two cleanup steps. It must stay above their sum:
    # a job killed by this timeout may never run its `if: always()` cleanup, leaving a
    # container and a ~400 MB image on the docker daemon shared by the whole fleet.
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7

    - name: Compute the local image tag
      id: tags
      # A purely local tag: no registry host in front of it, so there is nothing here that
      # `docker push` could even target. The run id keeps concurrent PR checks on the
      # shared runner daemon from clobbering each other's tag.
      env:
        RUN_ID: ${{ github.run_id }}
      run: |
        echo "local=token-checker-pr-check:$RUN_ID" >> "$GITHUB_OUTPUT"

    - name: Build the Docker image
      # Step-level `timeout-minutes` is the one known to be enforced by Gitea's act_runner;
      # the job-level one above is only the outer bound. 20 minutes is far above a
      # realistic cold build: `python:3.13` plus a `pip install` of eleven pinned wheels,
      # roughly 400 MB and a couple of minutes. Same number as in image-check-publish.yml:
      # the two gates build the identical Dockerfile and must not disagree about how long
      # that is allowed to take.
      timeout-minutes: 20
      env:
        # Through the environment rather than interpolated into the script text, same rule
        # as everywhere else in this repo's workflows.
        LOCAL_TAG: ${{ steps.tags.outputs.local }}
      run: |
        # --pull for the same reason as in image-check-publish.yml: cirunner-hatbox is
        # self-hosted with a persistent docker daemon, so without the flag a stale
        # python:3.13 could sit in the cache for months. And as there, this is a BuildKit
        # build despite the absence of `docker buildx` — that has been `docker build`'s
        # default since Engine 23.0.
        docker build --pull . --file Dockerfile --tag "$LOCAL_TAG"

    - name: Smoke-test the built image
      # There are no tests in this repo, so this is the whole PR gate. It runs the exact
      # same ci/smoke.py against the exact same kind of container as
      # image-check-publish.yml — only on a local tag, with no login and no push. Keeping
      # the script in one file is the point: two copies of it would drift, and the PR gate
      # would stop matching the gate that guards production.
      #
      # The container starts with the image's OWN command — no `--entrypoint`, which would
      # also drop the image's CMD and make "does the image's command actually run the
      # script" unanswerable (this image has no ENTRYPOINT, only
      # `CMD while true; do python token_checker.py; sleep 10; done`).
      #
      # There is deliberately NO readiness loop in this step: "the container is up" proves
      # nothing, because the shell loop keeps it running for ten seconds after every crash.
      # The waiting that does make sense — for the health endpoint and for the script to
      # appear in the process table — lives in ci/smoke.py, in bounded loops that report
      # their own bounds.
      #
      # The gate reaches no external API and holds no credential: the dummy GRIST_SERVER
      # below points at a `.invalid` host, which RFC 2606 reserves and no resolver can ever
      # answer.
      #
      # Nothing is published to the host: the checks run from inside via `docker exec`, so
      # parallel runs on this shared daemon cannot collide on a host port. The container
      # name carries the run id for the same reason.
      #
      # Step-level `timeout-minutes`, the one act_runner is known to enforce (the job-level
      # one is only the outer bound). Same 5 minutes as in image-check-publish.yml, for the
      # same arithmetic: a few seconds for the missing-env run, then ci/smoke.py's worst
      # case of a ~20-30 s process-table poll plus a health poll bounded at ~2 min 30 s.
      timeout-minutes: 5
      env:
        SMOKE_TAG: ${{ steps.tags.outputs.local }}
        NAME: token-checker-pr-check-${{ github.run_id }}
        SCRIPT_NAME: token_checker.py
        # The four variables main() requires, with values that are obviously fake and
        # deliberately unroutable: `.invalid` is reserved by RFC 2606 and can never resolve,
        # so the container cannot reach a real Grist even by accident, and the two keys are
        # self-describing nonsense that could not authenticate anywhere.
        # Passing them is what gets the script past its own guard and into main()'s body,
        # which is what starts the health server. That is safe precisely because
        # constructing the Grist client performs NO network I/O — it only builds an object
        # — so the health thread is listening before anything in the program has tried to
        # reach anywhere.
        DUMMY_GRIST_SERVER: http://grist.smoke.invalid
        DUMMY_GRIST_DOC_ID: smoke-not-a-real-doc-id
        DUMMY_GRIST_API_KEY: smoke-not-a-real-api-key
        DUMMY_ETHERSCAN_API_KEY: smoke-not-a-real-api-key
        # The one token matched in the guard's output. Deliberately just the variable name
        # and not the whole sentence around it: the wording of a log line is something
        # somebody will reword one day, the variable name is the contract with the
        # deployment.
        GUARD_MARKER: GRIST_SERVER
      # The body of this step is byte-identical to the one in image-check-publish.yml,
      # comments and all. Only the `env:` values above differ. The PR gate and the
      # publishing gate must run the same checks against the same kind of container, and
      # the cheapest way to guarantee that is for the two scripts to be literally the same
      # text — anything else drifts, and it drifts silently, in the direction of the PR
      # gate testing less.
      run: |
        # Self-healing retry: re-running a run from the UI keeps the same run_id, so $NAME
        # is exactly the name the previous attempt used — and an attempt killed by its
        # timeout never reaches the `if: always()` cleanup that would have removed the
        # container. Without this line the retry dies immediately on `docker run` with
        # "name already in use", and CI stays broken until somebody clears it by hand on
        # the shared runner host. A no-op on every run that has nothing left behind.
        docker rm -f "$NAME" || true

        # Check one, and the only one that cannot live inside ci/smoke.py because it needs
        # `docker run`: the missing-environment guard. main() exits 1 when any of
        # GRIST_SERVER, GRIST_DOC_ID, GRIST_API_KEY or ETHERSCAN_API_KEY is unset, so a
        # non-zero exit with NO environment at all proves that the entrypoint really
        # reaches main() and that the guard still fires — with no credential involved
        # anywhere.
        # The image's own CMD is overridden HERE and only here. It is
        # `while true; do python token_checker.py; sleep 10; done`, a loop that never
        # exits: a `docker run` that kept it would hang until this step's timeout and could
        # never observe the script's exit status at all. The ENVIRONMENT, which is what
        # this check is actually about, is untouched — not one `-e` is passed.
        guard_status=0
        guard_output=$(docker run --rm "$SMOKE_TAG" python "$SCRIPT_NAME" 2>&1) || guard_status=$?
        if [ "$guard_status" -eq 0 ]; then
          echo "the image exited 0 with no environment at all — the missing-env guard in main() did not fire, so nothing here proves the entrypoint reaches main(), and a deployment with a forgotten variable would sit in its restart loop looking healthy; output:"
          printf '%s\n' "$guard_output"
          exit 1
        fi
        # A non-zero exit on its own is NOT enough: an ImportError or a SyntaxError exits
        # non-zero too and would make this check pass for entirely the wrong reason. The
        # guard's own message is what tells those apart.
        case "$guard_output" in
          *"$GUARD_MARKER"*)
            ;;
          *)
            echo "the image exited $guard_status with no environment, but nothing in its output mentions $GUARD_MARKER — that is not the missing-env guard firing, it is the script dying of something else before it got there; output:"
            printf '%s\n' "$guard_output"
            exit 1
            ;;
        esac
        echo "ok   the missing-env guard fired: exit $guard_status with no environment, naming $GUARD_MARKER"

        # The container the remaining checks run against, started with the image's own CMD
        # and with dummy values for the four required variables — see the `env:` block
        # above for why that is both necessary and safe. HEALTH_PORT is deliberately NOT
        # set, so the gate exercises main()'s own 8080 default, which is also the port the
        # Dockerfile's HEALTHCHECK curls.
        docker run -d --name "$NAME" \
          -e GRIST_SERVER="$DUMMY_GRIST_SERVER" \
          -e GRIST_DOC_ID="$DUMMY_GRIST_DOC_ID" \
          -e GRIST_API_KEY="$DUMMY_GRIST_API_KEY" \
          -e ETHERSCAN_API_KEY="$DUMMY_ETHERSCAN_API_KEY" \
          "$SMOKE_TAG"

        # Fed over stdin, so the image does not have to carry the test file and the very
        # same script can be run by hand against a local container.
        #
        # `-u` is not decoration: this stdout is a pipe, and CPython block-buffers those.
        # A normal exit flushes (SystemExit(1) included, so a self-reported failure is
        # never lost), but a step killed by the timeout above would take the whole buffer
        # with it — losing every `ok` line already printed, in exactly the run whose log is
        # the only thing left to diagnose from.
        if ! docker exec -i "$NAME" python -u - < ci/smoke.py; then
          echo "smoke failed; container logs:"
          docker logs "$NAME"
          exit 1
        fi

        # Everything above proves the app ANSWERS on /health — over a python socket, from
        # inside the container. That is not the probe production acts on. The Dockerfile
        # declares `HEALTHCHECK --interval=10s --timeout=5s --start-period=10s --retries=3`
        # running `curl -f http://localhost:8080/health`, and the `autoheal` container in
        # the `crypt-common` stack on nebula restarts `tokenchecker` on THAT verdict. The
        # two can disagree: a move to a `-slim` base, or a Debian change that drops `curl`
        # from the image, leaves the endpoint answering perfectly while the healthcheck
        # fails forever — autoheal then restarts a healthy container roughly every 40s, and
        # every check above this line stays green throughout. So docker's own verdict has to
        # be required too, not just the endpoint's.
        #
        # The bound below comes from the healthcheck's own parameters rather than from a
        # taste in round numbers: `--start-period=10s` plus `--retries=3` at
        # `--interval=10s` means a container that does come up can take 10 + 3*10 = 40s
        # before its status settles. 30 attempts 2s apart bounds this at 60s — half again as
        # much slack, which a shared runner under load needs — and still leaves the step
        # inside its 5-minute timeout with ci/smoke.py's own bounded polls in front of it.
        #
        # `docker inspect` must not take the step down with it: on an image that declares no
        # HEALTHCHECK at all, `.State.Health` is nil and the template errors out, so stderr
        # is discarded and a non-zero inspect is normalised to the empty string — the same
        # way guard_status above is captured instead of being left to abort the shell. Empty
        # is then handled below as its own case, because it means something different.
        health_status=""
        attempts=0
        while [ "$attempts" -lt 30 ]; do
          health_status=$(docker inspect -f '{{.State.Health.Status}}' "$NAME" 2>/dev/null) || health_status=""
          if [ "$health_status" = "healthy" ]; then
            break
          fi
          attempts=$((attempts + 1))
          sleep 2
        done
        if [ "$health_status" != "healthy" ]; then
          if [ -z "$health_status" ]; then
            # No status at all is NOT "unhealthy" — it is "there is no healthcheck", i.e.
            # the HEALTHCHECK line has been removed from the Dockerfile. Nothing else in
            # this gate can see that happen, so it gets its own wording.
            echo "docker reports no health status for this container at all, which means the image declares no HEALTHCHECK — the line is gone from the Dockerfile. That probe is what the autoheal container in the crypt-common stack on nebula acts on, so with it gone a wedged tokenchecker would never be restarted again, and nothing else in this gate would notice: the /health endpoint answers fine on its own. container logs:"
          else
            echo "docker's health status was still '$health_status' after 60s and never reached 'healthy'. The /health endpoint answered fine above, so the app itself is up — what is broken is the Dockerfile's HEALTHCHECK, most likely a curl that is no longer in the image (a -slim base, a Debian change), which makes the probe fail forever. That probe is the one the autoheal container in the crypt-common stack on nebula acts on: it would restart this perfectly healthy container roughly every 40s. container logs:"
          fi
          # The probe's OWN output, before the application log. In the scenario this whole
          # check exists for the app is healthy and the log below is therefore perfectly
          # clean — the reason lives in .State.Health.Log[].Output, which is where a
          # `curl: not found` or the probe's exit code actually shows up. Without this the
          # gate can go red without ever saying why. In the no-HEALTHCHECK branch it prints
          # nothing, which is itself the confirmation of that diagnosis.
          docker inspect -f '{{json .State.Health}}' "$NAME" 2>/dev/null || true
          docker logs "$NAME"
          exit 1
        fi
        echo "ok   docker reports the container healthy: the Dockerfile's HEALTHCHECK, the probe autoheal acts on, really passes inside the image"

    - name: Remove the smoke container from the runner
      # `always()`, and before the image cleanup below: cirunner-hatbox has one persistent
      # docker daemon shared by every repository, so a container left behind by a failed
      # run would sit there forever — and would also pin the image, making the `docker rmi`
      # in the next step fail.
      # Only the long-lived container needs removing: the missing-env run in the smoke step
      # is `--rm` and cleans itself up even when it exits non-zero, which is the whole
      # point of that flag here.
      if: always()
      env:
        NAME: token-checker-pr-check-${{ github.run_id }}
      run: |
        docker rm -f "$NAME" || true

    - name: Remove the built image from the runner
      # The runner's docker daemon is persistent and shared with other repos, so every PR
      # check would otherwise leave an image behind forever. Removes ONLY the tag this run
      # created — no `docker system prune`, which would also wipe the images of every other
      # repo sharing the same daemon.
      # This gate runs on every push to a PR, so it produces MORE of that garbage than the
      # publishing workflow does — see the full note in image-check-publish.yml.
      # It does NOT reclaim everything: `docker rmi <tag>` never frees the BuildKit cache
      # (a separate builder store, reclaimed only by `docker builder prune`), and `--pull`
      # leaves the previous base image dangling whenever upstream publishes a new
      # python:3.13 digest. Both need a separate periodic cleanup on the runner host.
      # `always()` so a failed smoke still cleans up after itself.
      if: always()
      env:
        LOCAL_TAG: ${{ steps.tags.outputs.local }}
      run: |
        docker rmi "$LOCAL_TAG" || true

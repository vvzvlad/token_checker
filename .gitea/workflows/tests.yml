name: Tests

# PR gate. Never logs in, never pushes, uses no secrets. Runs the same pytest suite the
# publishing workflow gates on, then builds the image and runs the same ci/smoke.py, while
# :latest (followed by the `tokenchecker` container in the `crypt-common` stack on nebula)
# stays untouched by PR branches.
on:
  # Manual re-run for runs that flaked on runner networking; safe, nothing is published.
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read   # checkout

# Nothing is published, so a superseded run is cancelled (unlike image-check-publish.yml).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Outer bound over the 20-minute step; it must exceed the sum, because act_runner kills
    # the whole job when this fires and the cleanup step would not run.
    timeout-minutes: 25
    # Job-level so the create and cleanup steps cannot disagree about the name. The run id
    # keeps concurrent runs on the shared daemon apart; the `-pr-` infix only makes
    # `docker ps` readable.
    env:
      TEST_NAME: token-checker-tests-pr-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Run the test suite in a container
      # No `actions/setup-python`: setup actions are not verified on this self-hosted runner and
      # can silently check nothing. Running inside a container on the same docker the build
      # uses makes "the tests ran" and "docker works" the same statement.
      timeout-minutes: 20
      env:
        # The same base the Dockerfile ships, tag for tag.
        RUNTIME_IMAGE: python:3.13-slim
      # This `run:` body is byte-identical to the one in image-check-publish.yml.
      run: |
        set -e
        set -o pipefail
        # A UI re-run reuses github.run_id, so a killed attempt's container may still hold the
        # name, and `docker run --name` would fail on the conflict.
        docker rm -f -v "$TEST_NAME" || true
        # The workspace goes in as a tar over stdin, not a bind mount: this job runs inside
        # act_runner's container while `docker` talks to the host daemon, so `$PWD` means
        # something else (or nothing) on the host. It also keeps root-owned caches out of the
        # checkout. .dockerignore does not apply to a tar, so exclusions are listed here:
        # `.git` (unused), `.venv` (host wheels), `data/` (runtime state on a workstation),
        # `.env` (src/settings.py reads it via env_file, and a workstation's holds real
        # credentials), and caches from another interpreter.
        # `--pull always`: the daemon is persistent, so a cached base would go stale.
        # The four variables are placeholders; tests/conftest.py setdefault()s the same four.
        # `--name` makes the container reachable by the cleanup step: a step timeout kills the
        # docker CLI on the runner, not the container on the host, so `--rm` never fires.
        tar -cf - --exclude=./.git --exclude=./.venv --exclude=./data \
          --exclude=./.env --exclude=./.pytest_cache --exclude=__pycache__ . \
          | docker run --rm -i --pull always --name "$TEST_NAME" \
          -e GRIST_SERVER=http://grist.invalid \
          -e GRIST_DOC_ID=test-doc \
          -e GRIST_API_KEY=test-grist-api-key \
          -e ETHERSCAN_API_KEY=test-etherscan-api-key \
          -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
          -e PYTHONDONTWRITEBYTECODE=1 \
          "$RUNTIME_IMAGE" \
          sh -c 'set -e; mkdir -p /src; tar -xf - -C /src; cd /src; pip install --no-cache-dir -r requirements-dev.txt; pytest --tb=short -q'

    - name: Remove the test container from the runner
      # `always()`: this matters exactly when the step above failed or timed out and left the
      # container running on the shared daemon. Best-effort so a cleanup error cannot hide the
      # suite's verdict; `-v` drops anonymous volumes.
      if: always()
      run: |
        docker rm -f -v "$TEST_NAME" || true

  build-and-smoke:
    runs-on: ubuntu-latest
    needs: test                          # no green tests → no image is built
    # Same outer bound as image-check-publish.yml. Step timeouts here sum to 40 minutes
    # (20 build + 20 smoke); the bound must stay above that, because a job killed by it may
    # never run its `if: always()` cleanup.
    timeout-minutes: 50
    # Job-level so the smoke step and the cleanup step cannot disagree about the base name;
    # the run id keeps concurrent pull requests apart.
    env:
      SMOKE_NAME: token-checker-pr-check-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Compute the local image tag
      id: tags
      # Local tag with no registry host, so nothing can be pushed; the run id keeps concurrent
      # PR checks on the shared daemon apart.
      env:
        RUN_ID: ${{ github.run_id }}
      run: |
        echo "local=token-checker-pr-check:$RUN_ID" >> "$GITHUB_OUTPUT"

    - name: Build the Docker image
      # Same 20-minute step bound as image-check-publish.yml for the same Dockerfile.
      timeout-minutes: 20
      env:
        # Through the environment rather than interpolated into the script text.
        LOCAL_TAG: ${{ steps.tags.outputs.local }}
      run: |
        # --pull: the self-hosted daemon is persistent, so a cached python:3.13-slim would go
        # stale. This is a BuildKit build (the default since Engine 23.0).
        docker build --pull . --file Dockerfile --tag "$LOCAL_TAG"

    - name: Smoke-test the built image
      # The same gate as image-check-publish.yml, on a local tag with nothing after it, so a
      # pull request gets the identical verdict without any way to publish. See that file
      # for why it drives docker from the runner, publishes no port, uses only placeholder
      # configuration, and for the 20-minute budget.
      timeout-minutes: 20
      env:
        # The exact tag the build step produced. SMOKE_NAME comes from the job-level `env:`.
        SMOKE_IMAGE: ${{ steps.tags.outputs.local }}
      # This `run:` body is byte-identical to the one in image-check-publish.yml.
      run: |
        python3 ci/smoke.py

    - name: Remove the smoke containers from the runner
      # `always()`, and before the image cleanup: a leftover container on the shared daemon
      # would stay forever and pin the image, failing the `docker rmi` below.
      # ci/smoke.py removes both containers itself (before starting and in a `finally`), so
      # normally this is a no-op; it covers a smoke step killed by its timeout, which kills
      # the docker client but not the container. The empty suffix is the long-lived
      # container, -guard the missing-configuration one; keep in step with GUARD_SUFFIX in
      # ci/smoke.py. `-v` removes only that container's anonymous volumes.
      if: always()
      run: |
        for suffix in "" -guard; do docker rm -f -v "$SMOKE_NAME$suffix" || true; done

    - name: Remove the built image from the runner
      # Removes only this run's tag; `docker system prune` would hit other repos on the shared
      # daemon. The BuildKit cache and dangling old bases need a separate periodic cleanup.
      if: always()
      env:
        LOCAL_TAG: ${{ steps.tags.outputs.local }}
      run: |
        docker rmi "$LOCAL_TAG" || true
